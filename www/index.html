<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<script>try{var t=localStorage.getItem("xappTheme");if(t==="dark"||t==="light"||t==="lite")document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="theme-color" content="#0b0b0c" id="themeColor">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Xapp</title>
<!-- Xapp: chats, voice/video calls, status updates. Its own Firebase project and accounts
     (settings in config.js). Nothing is shared with other apps. -->
<script src="config.js" defer></script>
<script src="firebase-app-compat.js" defer></script>
<script src="firebase-auth-compat.js" defer></script>
<script src="firebase-firestore-compat.js" defer></script>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-weight:900;font-display:swap;src:url(fonts/figtree-latin-900-normal.woff2) format("woff2")}
#boot{position:fixed;inset:0;z-index:100;background:#ffffff;display:grid;place-items:center;transition:opacity .22s ease}
#boot img{width:192px;height:192px;display:block}
@media (prefers-color-scheme:dark){#boot{background:#0b0b0c}}
#boot.out{opacity:0;pointer-events:none}
/* Layout: black brand bar on top, list pane + chat pane (side by side on desktop, stacked screens on phone) */
:root{
  --head:#0b0b0c; --head-fg:#ffffff; --head-mute:#a8a29c; --head-line:#222224; --head-hover:rgba(255,255,255,.08);
  --field:#18181a; --field-line:#2b2b2f; --field-fg:#ffffff; --note-bg:#1c120b; --note-line:#4a2a14; --note-fg:#ffbe94;
  --bg:#0f0f10; --panel:#151517; --raise:#1f1f22; --line:#2a2a2e;
  --fg:#f3f1ee; --mute:#9b968f; --orange:#ff6a13; --orange-2:#ff8a45; --on-orange:#140700;
  --out:#3b1e0b; --in:#1f1f22; --wall:#0c0c0d; --wall-dot:#19191b;
  --good:#3ccf6e; --bad:#ff4d4d;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --head:#ffffff; --head-fg:#0b0b0c; --head-mute:#5f5a54; --head-line:#e6e1da; --head-hover:rgba(0,0,0,.06);
    --bg:#f5f3f0; --panel:#ffffff; --raise:#efebe6; --line:#e4dfd8;
    --fg:#141414; --mute:#6d6862; --out:#ffe1cc; --in:#ffffff; --wall:#ece8e2; --wall-dot:#e2ddd5;
    --field:#f3f0ec; --field-line:#e0dad2; --field-fg:#141414; --note-bg:#fff1e7; --note-line:#ffd2b3; --note-fg:#8a3a0c;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
    --head:#ffffff; --head-fg:#0b0b0c; --head-mute:#5f5a54; --head-line:#e6e1da; --head-hover:rgba(0,0,0,.06);
    --bg:#f5f3f0; --panel:#ffffff; --raise:#efebe6; --line:#e4dfd8;
    --fg:#141414; --mute:#6d6862; --out:#ffe1cc; --in:#ffffff; --wall:#ece8e2; --wall-dot:#e2ddd5;
    --field:#f3f0ec; --field-line:#e0dad2; --field-fg:#141414; --note-bg:#fff1e7; --note-line:#ffd2b3; --note-fg:#8a3a0c;
    color-scheme:light;
}
:root[data-theme="lite"]{
    --head:#0b0b0c; --head-fg:#ffffff; --head-mute:#a8a29c; --head-line:#0b0b0c; --head-hover:rgba(255,255,255,.08);
    --bg:#f5f3f0; --panel:#ffffff; --raise:#efebe6; --line:#e4dfd8;
    --fg:#141414; --mute:#6d6862; --out:#ffe1cc; --in:#ffffff; --wall:#ece8e2; --wall-dot:#e2ddd5;
    --field:#18181a; --field-line:#2b2b2f; --field-fg:#ffffff; --note-bg:#1c120b; --note-line:#4a2a14; --note-fg:#ffbe94;
    color-scheme:light;
}
:root[data-theme="lite"] .logo .mark{display:none}
:root[data-theme="lite"] .logo{font-family:var(--f-display);font-weight:800;letter-spacing:.2px}
:root[data-theme="lite"] .logo small{font-family:var(--f-body)}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,a,input,textarea,[role="button"],.row,.sr{touch-action:manipulation}
.bar,.tabs,.row,.sr,.set,.btn,.fab,.send,.ibtn,.callbtn,.acts,.menu,.me2,#login .swap{-webkit-user-select:none;user-select:none}
.row:active,.sr:active,button.set:active,.acts button:active,.menu button:active,.me2:active{background:var(--raise)}
.ibtn:active,.callbtn:active,.clearbtn:active{background:var(--head-hover)}
.btn:active,.fab:active,.send:active,.tabs button:active .ti,.tsw:active span{transform:scale(.95)}
.btn,.fab,.send,.tabs .ti,.tsw span{transition:transform .08s ease,background .15s}
.list,.wall,.form{overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){#boot,.btn,.fab,.send,.tabs .ti{transition:none}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{font-family:var(--f-body);font-weight:900;font-size:30px;letter-spacing:-.04em;line-height:1;display:flex;align-items:center;gap:8px;color:var(--head-fg)}
.logo .mark{width:1.4em;height:1.4em;flex:none}
.logo span{display:flex;align-items:center}
.logo b{font-weight:800}.logo i{font-style:normal;color:var(--orange)}
.logo small{font-size:12px;font-weight:700;letter-spacing:2.5px;font-family:var(--f-body);color:var(--head-mute);text-transform:uppercase}

/* shell */
.shell{position:fixed;inset:0;display:grid;grid-template-columns:1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
#chatPane{position:fixed;inset:0;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .22s ease}
#chatPane.open{transform:none}
@media (min-width:900px){
  .shell{grid-template-columns:400px 1fr}
  #chatPane{position:relative;inset:auto;transform:none;padding:0;border-left:1px solid var(--line)}
  .back{display:none!important}
}
@media (prefers-reduced-motion:reduce){#chatPane{transition:none}}

/* top bar */
.bar{background:var(--head);color:var(--head-fg);display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));min-height:60px}
.bar .grow{flex:1;min-width:0}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit}
@media (hover:hover){.ibtn:hover{background:var(--head-hover)}}
.bar{border-bottom:1px solid var(--head-line)}
.tabs{background:var(--head);display:flex;border-top:1px solid var(--head-line);padding:6px max(4px,env(safe-area-inset-right,0px)) 6px max(4px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;min-width:0;padding:4px 0 2px;font-weight:600;font-size:11.5px;color:var(--head-mute);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs .ti{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tabs button[aria-selected="true"]{color:var(--orange)}
.tabs button[aria-selected="true"] .ti{background:rgba(255,106,19,.16)}
.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;font-size:10.5px;padding:0 5px}
.set{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;text-align:left}
@media (hover:hover){button.set:hover{background:var(--raise)}}
.set .si{width:22px;color:var(--mute);display:grid;place-items:center;flex:none}
.set .st{flex:1;min-width:0}.set .st b{display:block;font-weight:500;font-size:15.5px}.set .st small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--orange)}.switch.on::after{transform:translateX(18px)}
/* Settings: compact grouped cards */
.sp{background:var(--bg);min-height:100%;padding:12px max(12px,env(safe-area-inset-right,0px)) 28px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.sg-h{font-size:11.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--mute);padding:12px 6px 4px}
.sg{background:var(--panel);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.sr{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 14px;text-align:left;position:relative}
@media (hover:hover){button.sr:hover{background:var(--raise)}}
.sr+.sr::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.sr .bd{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,106,19,.13);color:var(--orange)}
.sr .bd svg.i{width:17px;height:17px}
.sr .tx{flex:1;min-width:0}.sr .tx b{display:block;font-weight:500;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .tx small{display:block;color:var(--mute);font-size:12.5px;line-height:1.3;margin-top:1px}
.sr .tx small.warn{color:var(--orange)}
.sr .vl{font-size:13px;color:var(--mute);flex:none;display:flex;align-items:center;gap:6px}
.sr .chev{color:var(--mute);opacity:.6;flex:none}.sr .chev svg.i{width:16px;height:16px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}.dot.off{background:var(--bad)}
.sr.danger b{color:var(--bad)}.sr.danger .bd{background:rgba(255,77,77,.12);color:var(--bad)}
.sw-row{display:flex;gap:6px;flex:none}
.tsw{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.tsw span{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.tsw[aria-checked="true"] span{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--orange)}
.tsw .t-sys{background:linear-gradient(135deg,#ffffff 0 50%,#0b0b0c 50% 100%)}
.tsw .t-light{background:#ffffff}.tsw .t-dark{background:#0b0b0c}
.tsw .t-lite{background:linear-gradient(180deg,#0b0b0c 0 38%,#ffffff 38% 100%)}
.me2{display:flex;align-items:center;gap:14px;width:100%;padding:14px;text-align:left}
.me2 b{display:block;font-size:17px;font-weight:600}.me2 small{display:block;color:var(--mute);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-card{display:flex;align-items:center;gap:16px;padding:18px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.me-card b{font-size:19px;font-weight:600;display:block}.me-card small{color:var(--mute);font-size:14px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--orange);color:var(--on-orange);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;letter-spacing:0;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--raise);margin:10px 12px 4px;border-radius:22px;padding:0 14px;color:var(--mute)}
.search input{flex:1;border:0;background:none;padding:10px 0;outline:0;min-width:0}
.list{flex:1;overflow-y:auto;position:relative}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}
@media (hover:hover){.row:hover{background:var(--raise)}}
.row .mid{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:4px 0 12px}
.row:last-child .mid{border-bottom:0}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:12px;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.row .time.hot{color:var(--orange);font-weight:600}
.row .sub{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--mute);font-size:14px;margin-top:2px}
.row .sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.row .sub svg.i{width:16px;height:16px}
.sec{padding:14px 16px 6px;font-size:12.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute)}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#fff;background:#3a3a3f;background-size:cover;background-position:center;position:relative}
.av.sm{width:40px;height:40px;font-size:16px}
.av.xl{width:120px;height:120px;font-size:44px}
.av.lg{width:64px;height:64px;font-size:26px}
.av .dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--good);border:2px solid var(--panel)}
.ring{padding:3px;border-radius:50%;border:2.5px solid var(--orange);flex:none}
.ring.seen{border-color:var(--line)}
.ring .av{width:44px;height:44px}
.fab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:22px;width:58px;height:58px;border-radius:18px;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,106,19,.35)}
.fab svg.i{width:26px;height:26px}
.listwrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.empty{padding:40px 28px;text-align:center;color:var(--mute)}
.callbtn{color:var(--orange);width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
@media (hover:hover){.callbtn:hover{background:var(--raise)}}
.clearbtn{color:var(--orange);font-weight:600;font-size:13.5px;padding:8px 10px;border-radius:10px}
@media (hover:hover){.clearbtn:hover{background:var(--raise)}}
.acts{display:flex;flex-direction:column;padding:6px 0}
.acts button{display:flex;align-items:center;gap:14px;padding:14px 20px;text-align:left;font-size:15.5px}
@media (hover:hover){.acts button:hover{background:var(--raise)}}
.acts button svg.i{color:var(--mute)}
.acts .del,.acts .del svg.i{color:var(--bad)}
.in{color:var(--good)}.miss{color:var(--bad)}

/* chat */
.chat-head .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.chat-head .who b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who small{display:block;color:var(--head-mute);font-size:12.5px}
.wall{flex:1;overflow-y:auto;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.2px,transparent 1.3px);background-size:22px 22px;padding:12px max(10px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--raise);color:var(--mute);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;margin:10px 0 6px}
.msg{max-width:min(78%,520px);padding:6px 9px 6px 10px;border-radius:12px;background:var(--in);align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.12);position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--out)}
.msg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:filter .12s, transform .12s}
.msg.sel{filter:brightness(.88);transform:scale(.98)}
.msg.del{opacity:.85}
.gone{display:inline-flex;align-items:center;gap:6px;font-style:italic;color:var(--mute)}
.gone svg.i{width:15px;height:15px}
.pop{position:fixed;inset:0;z-index:72}
.popbg{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity .18s}
.popcard{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:22px 22px 0 0;padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px);transform:translateY(100%);transition:transform .2s ease;box-shadow:0 -10px 30px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
.pop.open .popbg{opacity:1}.pop.open .popcard{transform:none}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 2px}
@media (prefers-reduced-motion:reduce){.popbg,.popcard{transition:none}}
.msgprev{margin:14px 20px 4px;padding:12px 14px;border-radius:12px;background:var(--raise);color:var(--fg);font-size:14.5px;line-height:1.4;word-break:break-word}
.msg.first{margin-top:6px}
.msg .meta{float:right;display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--mute);margin:8px 0 -4px 10px;font-variant-numeric:tabular-nums}
.msg .meta svg.i{width:16px;height:16px}
.msg .meta .read{color:var(--orange)}
.msg img,.msg video{display:block;max-width:100%;width:280px;border-radius:8px;background:var(--raise);min-height:120px;object-fit:cover}
.msg .cap{margin-top:4px}
.audio{display:flex;align-items:center;gap:10px;min-width:220px}
.audio .play{width:38px;height:38px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;flex:none}
.audio .play svg.i{width:18px;height:18px;fill:currentColor;stroke:none}
.audio .track{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative}
.audio .track i{position:absolute;inset:0 auto 0 0;background:var(--orange);border-radius:2px;width:0}
.audio small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.loading{color:var(--mute);font-size:13px;padding:30px 10px;text-align:center}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));background:var(--wall)}
.field{flex:1;display:flex;align-items:flex-end;gap:2px;background:var(--panel);border-radius:24px;padding:4px 6px;min-width:0}
.field textarea{flex:1;border:0;background:none;resize:none;outline:0;padding:9px 4px;max-height:120px;min-width:0}
.field .ibtn{color:var(--mute);width:38px;height:38px}
.send{width:48px;height:48px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;flex:none}
.send.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,77,.55)}100%{box-shadow:0 0 0 14px rgba(255,77,77,0)}}
.recbar{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:24px;padding:0 14px;height:48px;color:var(--mute)}
.recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.recbar b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.attach{position:absolute;left:12px;bottom:70px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:grid;grid-template-columns:repeat(5,minmax(56px,1fr));gap:10px 6px;max-width:calc(100vw - 24px);box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:3}
.attach button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.attach button span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:var(--on-orange)}
.attach button:nth-child(2) span{background:#2f2f33;color:#fff}
.attach button:nth-child(3) span{background:#ffffff;color:#0b0b0c;box-shadow:inset 0 0 0 1px var(--line)}
.attach button:nth-child(4) span{background:#2f9e5b;color:#fff}
.attach button:nth-child(5) span{background:#3b6fd8;color:#fff}
/* location */
.map{position:relative;overflow:hidden;background:#e6e1da;border-radius:8px;max-width:100%}
.map img{position:absolute!important;width:256px!important;height:256px!important;max-width:none!important;min-height:0!important;border-radius:0!important;object-fit:fill!important;background:none!important;display:block;user-select:none;-webkit-user-drag:none;cursor:pointer}
.map .pin{position:absolute;left:50%;top:50%;width:28px;height:38px;transform:translate(-50%,-100%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.map .osm{position:absolute;right:4px;bottom:3px;font-size:9.5px;color:#333;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px}
.locmsg{display:block;border-radius:8px;overflow:hidden;max-width:100%}
.locmsg .map{max-width:none}
.locinfo{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.locinfo b{font-weight:600}.locinfo small{color:var(--mute);font-size:12px}
.locbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.locbtns a{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:18px;background:rgba(255,106,19,.12);color:var(--orange);font-weight:600;font-size:13px;text-decoration:none}
.locbtns svg.i{width:15px;height:15px}
.locnav{display:inline-flex;align-items:center;gap:6px;color:var(--orange);font-weight:600;font-size:13.5px;margin-top:6px;text-decoration:none}
.locnav svg.i{width:15px;height:15px}
.locprev .map{border-radius:14px}
.locwait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 10px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* scanner */
.scan{position:fixed;inset:0;z-index:75;background:#0b0b0c;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.scanbar{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 8px}
.scanbar b{font-size:16px;font-weight:600}
.scanstage{flex:1;position:relative;min-height:0;margin:0 12px;display:grid;place-items:center;overflow:hidden}
.scanstage canvas{position:absolute}
.scanstage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.scanstage > img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.hdl{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;touch-action:none;display:grid;place-items:center}
.hdl::after{content:"";width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #FF6A13;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.chips{display:flex;gap:8px;justify-content:center;padding:12px}
.chips button{padding:8px 14px;border-radius:18px;border:1px solid #3a3a3f;color:#ddd;font-size:13.5px}
.chips button[aria-checked="true"]{background:#FF6A13;border-color:#FF6A13;color:#140700;font-weight:600}
.scanfoot{display:flex;gap:10px;padding:8px 14px 14px}
.scanfoot .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px}
.scanfoot .btn.ghost{background:#1f1f22;color:#fff}
/* viewer */
.viewer{position:fixed;inset:0;z-index:78;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.vbar span{font-size:14px;color:#ccc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vstage{flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;touch-action:none;cursor:grab}
.vstage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center center;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.vhint{text-align:center;font-size:12px;color:#888;margin:6px 0 10px}
.msg img{cursor:zoom-in}
.nochat{flex:1;display:grid;place-items:center;text-align:center;background:var(--wall);color:var(--mute);padding:30px}
.nochat .logo{justify-content:center;flex-direction:column;font-size:60px;gap:14px;color:var(--fg);margin-bottom:14px}
.nochat .logo .mark{width:1.3em;height:1.3em}

/* overlays */
.sheet{position:fixed;inset:0;z-index:40;background:var(--panel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.sheet{left:0;right:auto;width:400px;border-right:1px solid var(--line)}}
.form{padding:20px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.form label{font-size:12.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--orange)}
.form input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0}
.form input:focus{border-color:var(--orange)}
.btn{background:var(--orange);color:var(--on-orange);font-weight:700;border-radius:24px;padding:13px 20px;text-align:center}
.btn.ghost{background:var(--raise);color:var(--fg)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--bad);font-size:13.5px;min-height:18px}

/* login */
#login{position:fixed;inset:0;z-index:60;background:var(--head);color:var(--head-fg);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
#login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
#login .logo{font-size:64px;justify-content:center;flex-direction:column;align-items:center;gap:16px}
#login .logo .mark{width:1.35em;height:1.35em}
#login .logo small{font-size:13px;letter-spacing:3px}
#login .tag{text-align:center;color:var(--head-mute);margin:2px 0 18px;font-size:14px}
#login input{background:var(--field);border:1px solid var(--field-line);color:var(--field-fg);border-radius:12px;padding:14px;outline:0;width:100%}
#login input:focus{border-color:var(--orange)}
#login .swap{color:var(--orange-2);font-weight:600;font-size:14px;text-align:center;padding:6px}
#login .demo{background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-fg);border-radius:12px;padding:10px 12px;font-size:13px}

/* status viewer + composer */
.story{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.story .prog{display:flex;gap:4px;padding:10px 10px 0}
.story .prog span{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story .prog i{display:block;height:100%;width:0;background:#fff}
.story .hd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.story .body{flex:1;display:grid;place-items:center;min-height:0;position:relative}
.story .body img{max-width:100%;max-height:100%;object-fit:contain}
.story .txt{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,52px);line-height:1.1;text-align:center;padding:30px;text-wrap:balance;width:100%;height:100%;display:grid;place-items:center}
.story .cap{text-align:center;padding:14px 20px 24px}
.story .tap{position:absolute;top:0;bottom:0;width:35%}
.compose-txt{flex:1;border:0;outline:0;background:none;color:#fff;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,48px);resize:none;padding:40px 24px}

/* call */
#call{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 80% at 50% 0%,#2a1306 0%,#0b0b0c 60%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px calc(env(safe-area-inset-bottom,0px) + 36px)}
#call video.remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#call video.local{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 16px);width:110px;height:160px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:#111;transform:scaleX(-1);z-index:2}
#call .topb{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4;color:#fff;background:rgba(0,0,0,.25)}
#call .ctrls,#call .info,#call .topb{transition:opacity .25s ease,transform .25s ease}
#call.idle .ctrls{opacity:0;transform:translateY(24px);pointer-events:none}
#call.idle .info,#call.idle .topb{opacity:0;pointer-events:none}
#call video.local{cursor:grab;transition:left .22s ease,top .22s ease}
.callbar{position:fixed;left:0;right:0;top:0;z-index:85;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 9px) max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));background:#1f9d55;color:#fff;font-size:14px;text-align:left}
.callbar b{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callbar #cbT{font-variant-numeric:tabular-nums;font-weight:600}
.callbar .cbtap{font-size:12px;opacity:.85}
.cbdot{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
body.incall .shell,body.incall #chatPane{padding-top:calc(env(safe-area-inset-top,0px) + 40px)}
.pip{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:86;width:116px;height:170px;border-radius:16px;overflow:hidden;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.18);cursor:grab}
.pip video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.pipn,.pipt{position:absolute;left:8px;right:8px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.pipn{bottom:22px;font-weight:600}.pipt{bottom:6px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.cbdot{animation:none}#call .ctrls,#call .info,#call .topb{transition:none}}
#call .info{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#call .info .enc{font-size:12px;color:#c9c2ba;letter-spacing:.5px}
#call .info h2{font-family:var(--f-display);font-size:34px;margin:6px 0 0;font-weight:700;letter-spacing:.3px}
#call .info p{margin:0;color:#ffb17f;font-variant-numeric:tabular-nums}
#call.video-on .info{text-shadow:0 1px 6px rgba(0,0,0,.8)}
#call.video-on .info .av{display:none}
#call .ctrls{margin-top:auto;position:relative;z-index:2;display:flex;gap:14px;background:rgba(20,20,22,.82);padding:14px 18px 10px;border-radius:32px;backdrop-filter:blur(8px)}
#call .cb{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px}
#call .cb small{font-size:11.5px;color:#d6d0c9;font-weight:500;white-space:nowrap}
.audmenu{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);background:#1c1c1f;border:1px solid #2e2e32;border-radius:18px;padding:6px;min-width:240px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.audmenu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;color:#fff;font-size:15px;text-align:left}
.audmenu button:active{background:#2b2b2f}
.audmenu button span{flex:1;display:flex;flex-direction:column}.audmenu small{color:#a8a29c;font-size:12px}
.audmenu button[aria-checked="true"]{color:var(--orange)}
#call .ctrls button{width:56px;height:56px;border-radius:50%;background:#2b2b2f;display:grid;place-items:center}
#call .ctrls button.on{background:#fff;color:#0b0b0c}
#call .ctrls .end{background:var(--bad)}
#call .ctrls .ok{background:var(--good)}
#call .pulse{animation:ringpulse 1.6s infinite}
@keyframes ringpulse{0%{box-shadow:0 0 0 0 rgba(255,106,19,.6)}100%{box-shadow:0 0 0 30px rgba(255,106,19,0)}}

.pop:not([hidden]) ~ .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 320px)}
#call:not([hidden]) ~ .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:#fff;color:#0b0b0c;padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
.menu{position:absolute;right:10px;top:56px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;min-width:200px;z-index:30;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;color:var(--fg);font-size:15.5px}
@media (hover:hover){.menu button:hover{background:var(--raise)}}
.typing{color:var(--orange-2)!important}
</style>
</head>
<body>

<div id="boot" aria-label="Xapp is starting"><img src="splash-icon.png" alt="" width="192" height="192"></div>
<!-- LOGIN -->
<section id="login" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo"><svg class="mark" viewBox="70 60 380 380" aria-hidden="true"><g fill="#FF6A13"><circle cx="256" cy="246" r="168"/><path d="M150 336 C146 372 132 398 108 418 C150 420 196 404 230 372 Z"/></g><path d="M200 190 L312 302 M312 190 L200 302" stroke="#0B0B0C" stroke-width="38" stroke-linecap="round" fill="none"/></svg><span><i>X</i><b>app</b></span><small>Chat · Call · Updates</small></div>
    <div style="height:14px"></div>
    <div class="demo" id="demoNote" hidden>Demo mode with sample contacts. Xapp goes live once its Firebase settings are added to config.js. Sign in with any username.</div>
    <input id="lgName" placeholder="Your name" hidden autocomplete="name">
    <input id="lgUser" placeholder="Email or username" required autocomplete="username" autocapitalize="none" inputmode="email">
    <input id="lgPass" type="password" placeholder="Password (min 6)" required minlength="6" autocomplete="current-password">
    <div class="err" id="lgErr"></div>
    <button class="btn" type="submit" id="lgBtn">Sign in</button>
    <button class="swap" type="button" id="lgSwap">New here? Create account</button>
    <button class="swap" type="button" id="lgForgot" style="color:var(--head-mute);font-weight:500">Forgot password?</button>
  </form>
</section>

<!-- APP -->
<div class="shell" id="shell" hidden>
  <section class="pane" id="listPane">
    <header class="bar" style="position:relative">
      <div class="grow"><div class="logo"><svg class="mark" viewBox="70 60 380 380" aria-hidden="true"><g fill="#FF6A13"><circle cx="256" cy="246" r="168"/><path d="M150 336 C146 372 132 398 108 418 C150 420 196 404 230 372 Z"/></g><path d="M200 190 L312 302 M312 190 L200 302" stroke="#0B0B0C" stroke-width="38" stroke-linecap="round" fill="none"/></svg><span><i>X</i><b>app</b></span></div></div>
      <button class="ibtn" id="btnCam" aria-label="New status photo"></button>
      <button class="ibtn" id="btnMenu" aria-label="Menu"></button>
      <div class="menu" id="menu" hidden>
        <button data-act="settings">Settings</button>
        <button data-act="contacts">Contacts</button>
        <button data-act="testcall" id="mTest" hidden>Test incoming call</button>
        <button data-act="logout">Sign out</button>
      </div>
    </header>
    <div class="listwrap">
      <label class="search"><span id="icoSearch"></span><input id="q" placeholder="Search" aria-label="Search"></label>
      <div class="list" id="list"></div>
      <button class="fab" id="fab" aria-label="New"></button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="chats" aria-selected="true"><span class="ti" id="tiChats"></span>Chats<span class="badge" id="unreadAll" hidden></span></button>
      <button role="tab" data-tab="updates" aria-selected="false"><span class="ti" id="tiUpd"></span>Updates</button>
      <button role="tab" data-tab="calls" aria-selected="false"><span class="ti" id="tiCalls"></span>Calls<span class="badge" id="missedAll" hidden></span></button>
      <button role="tab" data-tab="contacts" aria-selected="false"><span class="ti" id="tiCont"></span>Contacts</button>
      <button role="tab" data-tab="settings" aria-selected="false"><span class="ti" id="tiSet"></span>Settings</button>
    </nav>
  </section>

  <section class="pane" id="chatPane">
    <div class="nochat" id="nochat">
      <div><div class="logo"><svg class="mark" viewBox="70 60 380 380" aria-hidden="true"><g fill="#FF6A13"><circle cx="256" cy="246" r="168"/><path d="M150 336 C146 372 132 398 108 418 C150 420 196 404 230 372 Z"/></g><path d="M200 190 L312 302 M312 190 L200 302" stroke="#0B0B0C" stroke-width="38" stroke-linecap="round" fill="none"/></svg><span><i>X</i><b>app</b></span></div><p>Pick a contact to chat or call.<br>Messages and calls stay private.</p></div>
    </div>
    <header class="bar chat-head" id="chatHead" hidden></header>
    <div class="wall" id="wall" hidden></div>
    <div style="position:relative" id="composerWrap" hidden>
      <div class="attach" id="attach" hidden>
        <button data-pick="gallery"><span id="icoGal"></span>Gallery</button>
        <button data-pick="camera"><span id="icoCamA"></span>Camera</button>
        <button data-pick="video"><span id="icoVid"></span>Video</button>
        <button data-pick="location"><span id="icoLoc"></span>Location</button>
        <button data-pick="scan"><span id="icoScan"></span>Scan</button>
      </div>
      <div class="composer" id="composer"></div>
    </div>
  </section>
</div>

<input type="file" id="fGallery" accept="image/*,video/*" hidden>
<input type="file" id="fCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fVideo" accept="video/*" capture="environment" hidden>
<input type="file" id="fScan" accept="image/*" capture="environment" hidden>
<input type="file" id="fStatus" accept="image/*" hidden>
<input type="file" id="fAvatar" accept="image/*" hidden>

<div id="sheet" class="sheet" hidden></div>
<div id="story" class="story" hidden></div>
<div id="scan" class="scan" hidden></div>
<div id="viewer" class="viewer" hidden></div>
<div id="pop" class="pop" hidden></div>
<section id="call" hidden></section>
<div class="toast" id="toast" hidden></div>

<script src="app.js" defer></script>
<script src="extras.js" defer></script>
</body>
</html>
