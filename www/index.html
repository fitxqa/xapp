<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="icon.png">
<title>Xapp</title>
<!-- Xapp: chats, voice/video calls, status updates. Its own Firebase project and accounts
     (settings in config.js). Nothing is shared with other apps. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<style>
/* Layout: black brand bar on top, list pane + chat pane (side by side on desktop, stacked screens on phone) */
:root{
  --head:#0b0b0c; --head-fg:#ffffff;
  --bg:#0f0f10; --panel:#151517; --raise:#1f1f22; --line:#2a2a2e;
  --fg:#f3f1ee; --mute:#9b968f; --orange:#ff6a13; --orange-2:#ff8a45; --on-orange:#140700;
  --out:#3b1e0b; --in:#1f1f22; --wall:#0c0c0d; --wall-dot:#19191b;
  --good:#3ccf6e; --bad:#ff4d4d;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f3f0; --panel:#ffffff; --raise:#efebe6; --line:#e4dfd8;
    --fg:#141414; --mute:#6d6862; --out:#ffe1cc; --in:#ffffff; --wall:#ece8e2; --wall-dot:#e2ddd5;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.logo{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.5px;line-height:1;display:flex;align-items:baseline;gap:6px;color:var(--head-fg)}
.logo b{font-weight:800}.logo i{font-style:normal;color:var(--orange)}
.logo small{font-size:12px;font-weight:700;letter-spacing:2.5px;color:#bdb7b0;text-transform:uppercase}

/* shell */
.shell{position:fixed;inset:0;display:grid;grid-template-columns:1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
#chatPane{position:fixed;inset:0;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .22s ease}
#chatPane.open{transform:none}
@media (min-width:900px){
  .shell{grid-template-columns:400px 1fr}
  #chatPane{position:relative;inset:auto;transform:none;padding:0;border-left:1px solid var(--line)}
  .back{display:none!important}
}
@media (prefers-reduced-motion:reduce){#chatPane{transition:none}}

/* top bar */
.bar{background:var(--head);color:var(--head-fg);display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));min-height:60px}
.bar .grow{flex:1;min-width:0}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:inherit}
.ibtn:hover{background:rgba(255,255,255,.08)}
.tabs{background:var(--head);display:flex;border-top:1px solid #222;padding:6px max(4px,env(safe-area-inset-right,0px)) 6px max(4px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;min-width:0;padding:4px 0 2px;font-weight:600;font-size:11.5px;color:#a29c95;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs .ti{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tabs button[aria-selected="true"]{color:var(--orange)}
.tabs button[aria-selected="true"] .ti{background:rgba(255,106,19,.16)}
.tabs .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;font-size:10.5px;padding:0 5px}
.set{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;text-align:left}
button.set:hover{background:var(--raise)}
.set .si{width:22px;color:var(--mute);display:grid;place-items:center;flex:none}
.set .st{flex:1;min-width:0}.set .st b{display:block;font-weight:500;font-size:15.5px}.set .st small{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--orange)}.switch.on::after{transform:translateX(18px)}
.me-card{display:flex;align-items:center;gap:16px;padding:18px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.me-card b{font-size:19px;font-weight:600;display:block}.me-card small{color:var(--mute);font-size:14px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--orange);color:var(--on-orange);font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;letter-spacing:0;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:8px;background:var(--raise);margin:10px 12px 4px;border-radius:22px;padding:0 14px;color:var(--mute)}
.search input{flex:1;border:0;background:none;padding:10px 0;outline:0;min-width:0}
.list{flex:1;overflow-y:auto;position:relative}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}
.row:hover{background:var(--raise)}
.row .mid{flex:1;min-width:0;border-bottom:1px solid var(--line);padding:4px 0 12px}
.row:last-child .mid{border-bottom:0}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .time{font-size:12px;color:var(--mute);flex:none;font-variant-numeric:tabular-nums}
.row .time.hot{color:var(--orange);font-weight:600}
.row .sub{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--mute);font-size:14px;margin-top:2px}
.row .sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;min-width:0}
.row .sub svg.i{width:16px;height:16px}
.sec{padding:14px 16px 6px;font-size:12.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mute)}
.av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#fff;background:#3a3a3f;background-size:cover;background-position:center;position:relative}
.av.sm{width:40px;height:40px;font-size:16px}
.av.xl{width:120px;height:120px;font-size:44px}
.av.lg{width:64px;height:64px;font-size:26px}
.av .dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--good);border:2px solid var(--panel)}
.ring{padding:3px;border-radius:50%;border:2.5px solid var(--orange);flex:none}
.ring.seen{border-color:var(--line)}
.ring .av{width:44px;height:44px}
.fab{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:22px;width:58px;height:58px;border-radius:18px;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,106,19,.35)}
.fab svg.i{width:26px;height:26px}
.listwrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.empty{padding:40px 28px;text-align:center;color:var(--mute)}
.callbtn{color:var(--orange);width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.callbtn:hover{background:var(--raise)}
.in{color:var(--good)}.miss{color:var(--bad)}

/* chat */
.chat-head .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:left}
.chat-head .who b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who small{display:block;color:#b9b3ab;font-size:12.5px}
.wall{flex:1;overflow-y:auto;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.2px,transparent 1.3px);background-size:22px 22px;padding:12px max(10px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--raise);color:var(--mute);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;margin:10px 0 6px}
.msg{max-width:min(78%,520px);padding:6px 9px 6px 10px;border-radius:12px;background:var(--in);align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.12);position:relative;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--out)}
.msg.first{margin-top:6px}
.msg .meta{float:right;display:inline-flex;gap:3px;align-items:center;font-size:11px;color:var(--mute);margin:8px 0 -4px 10px;font-variant-numeric:tabular-nums}
.msg .meta svg.i{width:16px;height:16px}
.msg .meta .read{color:var(--orange)}
.msg img,.msg video{display:block;max-width:100%;width:280px;border-radius:8px;background:var(--raise);min-height:120px;object-fit:cover}
.msg .cap{margin-top:4px}
.audio{display:flex;align-items:center;gap:10px;min-width:220px}
.audio .play{width:38px;height:38px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;flex:none}
.audio .play svg.i{width:18px;height:18px;fill:currentColor;stroke:none}
.audio .track{flex:1;height:4px;border-radius:2px;background:var(--line);position:relative}
.audio .track i{position:absolute;inset:0 auto 0 0;background:var(--orange);border-radius:2px;width:0}
.audio small{color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.loading{color:var(--mute);font-size:13px;padding:30px 10px;text-align:center}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));background:var(--wall)}
.field{flex:1;display:flex;align-items:flex-end;gap:2px;background:var(--panel);border-radius:24px;padding:4px 6px;min-width:0}
.field textarea{flex:1;border:0;background:none;resize:none;outline:0;padding:9px 4px;max-height:120px;min-width:0}
.field .ibtn{color:var(--mute);width:38px;height:38px}
.send{width:48px;height:48px;border-radius:50%;background:var(--orange);color:var(--on-orange);display:grid;place-items:center;flex:none}
.send.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.recbar{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:24px;padding:0 14px;height:48px;color:var(--mute)}
.recbar .dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
.recbar b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.attach{position:absolute;left:12px;bottom:70px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:18px;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:3}
.attach button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.attach button span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--orange);color:var(--on-orange)}
.attach button:nth-child(2) span{background:#2f2f33;color:#fff}
.attach button:nth-child(3) span{background:#ffffff;color:#0b0b0c}
.nochat{flex:1;display:grid;place-items:center;text-align:center;background:var(--wall);color:var(--mute);padding:30px}
.nochat .logo{justify-content:center;font-size:54px;color:var(--fg);margin-bottom:10px}

/* overlays */
.sheet{position:fixed;inset:0;z-index:40;background:var(--panel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){.sheet{left:0;right:auto;width:400px;border-right:1px solid var(--line)}}
.form{padding:20px max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.form label{font-size:12.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--orange)}
.form input{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0}
.form input:focus{border-color:var(--orange)}
.btn{background:var(--orange);color:var(--on-orange);font-weight:700;border-radius:24px;padding:13px 20px;text-align:center}
.btn.ghost{background:var(--raise);color:var(--fg)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.note{font-size:13px;color:var(--mute)}
.err{color:var(--bad);font-size:13.5px;min-height:18px}

/* login */
#login{position:fixed;inset:0;z-index:60;background:var(--head);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
#login .card{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
#login .logo{font-size:64px;justify-content:center;flex-direction:column;align-items:center;gap:4px}
#login .logo small{font-size:13px;letter-spacing:3px}
#login .tag{text-align:center;color:#a39d96;margin:2px 0 18px;font-size:14px}
#login input{background:#18181a;border:1px solid #2b2b2f;color:#fff;border-radius:12px;padding:14px;outline:0;width:100%}
#login input:focus{border-color:var(--orange)}
#login .swap{color:var(--orange-2);font-weight:600;font-size:14px;text-align:center;padding:6px}
#login .demo{background:#1c120b;border:1px solid #4a2a14;color:#ffbe94;border-radius:12px;padding:10px 12px;font-size:13px}

/* status viewer + composer */
.story{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.story .prog{display:flex;gap:4px;padding:10px 10px 0}
.story .prog span{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story .prog i{display:block;height:100%;width:0;background:#fff}
.story .hd{display:flex;align-items:center;gap:10px;padding:10px 12px}
.story .body{flex:1;display:grid;place-items:center;min-height:0;position:relative}
.story .body img{max-width:100%;max-height:100%;object-fit:contain}
.story .txt{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,52px);line-height:1.1;text-align:center;padding:30px;text-wrap:balance;width:100%;height:100%;display:grid;place-items:center}
.story .cap{text-align:center;padding:14px 20px 24px}
.story .tap{position:absolute;top:0;bottom:0;width:35%}
.compose-txt{flex:1;border:0;outline:0;background:none;color:#fff;text-align:center;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,48px);resize:none;padding:40px 24px}

/* call */
#call{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 80% at 50% 0%,#2a1306 0%,#0b0b0c 60%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 20px calc(env(safe-area-inset-bottom,0px) + 36px)}
#call video.remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#call video.local{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 16px);width:110px;height:160px;object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:#111;transform:scaleX(-1);z-index:2}
#call .info{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#call .info .enc{font-size:12px;color:#c9c2ba;letter-spacing:.5px}
#call .info h2{font-family:var(--f-display);font-size:34px;margin:6px 0 0;font-weight:700;letter-spacing:.3px}
#call .info p{margin:0;color:#ffb17f;font-variant-numeric:tabular-nums}
#call.video-on .info{text-shadow:0 1px 6px rgba(0,0,0,.8)}
#call.video-on .info .av{display:none}
#call .ctrls{margin-top:auto;position:relative;z-index:2;display:flex;gap:18px;background:rgba(20,20,22,.8);padding:14px 20px;border-radius:40px;backdrop-filter:blur(8px)}
#call .ctrls button{width:56px;height:56px;border-radius:50%;background:#2b2b2f;display:grid;place-items:center}
#call .ctrls button.on{background:#fff;color:#0b0b0c}
#call .ctrls .end{background:var(--bad)}
#call .ctrls .ok{background:var(--good)}
#call .pulse{animation:ringpulse 1.6s infinite}
@keyframes ringpulse{0%{box-shadow:0 0 0 0 rgba(255,106,19,.6)}100%{box-shadow:0 0 0 30px rgba(255,106,19,0)}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);transform:translateX(-50%);background:#fff;color:#0b0b0c;padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
.menu{position:absolute;right:10px;top:56px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;min-width:200px;z-index:30;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.menu button{display:block;width:100%;text-align:left;padding:13px 16px;color:var(--fg);font-size:15.5px}
.menu button:hover{background:var(--raise)}
.typing{color:var(--orange-2)!important}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="logo"><span><i>X</i><b>app</b></span></div>
    <p class="tag">Chats · voice &amp; video calls · updates</p>
    <div class="demo" id="demoNote" hidden>Demo mode with sample contacts. Xapp goes live once its Firebase settings are added to config.js. Sign in with any username.</div>
    <input id="lgName" placeholder="Full name (e.g. Ahmed – Technician)" hidden autocomplete="name">
    <input id="lgUser" placeholder="Username" required autocomplete="username" autocapitalize="none">
    <input id="lgPass" type="password" placeholder="Password (min 6)" required minlength="6" autocomplete="current-password">
    <div class="err" id="lgErr"></div>
    <button class="btn" type="submit" id="lgBtn">Sign in</button>
    <button class="swap" type="button" id="lgSwap">New employee? Create account</button>
  </form>
</section>

<!-- APP -->
<div class="shell" id="shell" hidden>
  <section class="pane" id="listPane">
    <header class="bar" style="position:relative">
      <div class="grow"><div class="logo"><span><i>X</i><b>app</b></span></div></div>
      <button class="ibtn" id="btnCam" aria-label="New status photo"></button>
      <button class="ibtn" id="btnMenu" aria-label="Menu"></button>
      <div class="menu" id="menu" hidden>
        <button data-act="settings">Settings</button>
        <button data-act="contacts">Contacts</button>
        <button data-act="testcall" id="mTest" hidden>Test incoming call</button>
        <button data-act="logout">Sign out</button>
      </div>
    </header>
    <div class="listwrap">
      <label class="search"><span id="icoSearch"></span><input id="q" placeholder="Search" aria-label="Search"></label>
      <div class="list" id="list"></div>
      <button class="fab" id="fab" aria-label="New"></button>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="chats" aria-selected="true"><span class="ti" id="tiChats"></span>Chats<span class="badge" id="unreadAll" hidden></span></button>
      <button role="tab" data-tab="updates" aria-selected="false"><span class="ti" id="tiUpd"></span>Updates</button>
      <button role="tab" data-tab="calls" aria-selected="false"><span class="ti" id="tiCalls"></span>Calls<span class="badge" id="missedAll" hidden></span></button>
      <button role="tab" data-tab="contacts" aria-selected="false"><span class="ti" id="tiCont"></span>Contacts</button>
      <button role="tab" data-tab="settings" aria-selected="false"><span class="ti" id="tiSet"></span>Settings</button>
    </nav>
  </section>

  <section class="pane" id="chatPane">
    <div class="nochat" id="nochat">
      <div><div class="logo"><span><i>X</i><b>app</b></span></div><p>Pick a contact to chat or call.<br>Messages and calls stay private.</p></div>
    </div>
    <header class="bar chat-head" id="chatHead" hidden></header>
    <div class="wall" id="wall" hidden></div>
    <div style="position:relative" id="composerWrap" hidden>

const ico = (n, extra="") => `<svg class="i" viewBox="0 0 24 24" ${extra}><path d="${P[n]}"/></svg>`;

const AVC = ["#ff6a13","#3a3a3f","#b8460b","#57534e","#d9570f","#26262a","#8a3a0c"];
function avatar(u, cls="", online=false){
  if(!u) u = {name:"?"};
  const ini = (u.name||u.username||"?").replace(/\(.*?\)/g,"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  const col = AVC[[...(u.uid||u.name||"x")].reduce((a,c)=>a+c.charCodeAt(0),0)%AVC.length];
  const st = u.photo ? `background-image:url('${u.photo}')` : `background:${col}`;
  return `<span class="av ${cls}" style="${st}">${u.photo?"":esc(ini)}${online?'<span class="dot"></span>':""}</span>`;
}
const pad = n => String(n).padStart(2,"0");
const hm = t => { const d=new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function dayLabel(t){
  const d=new Date(t), n=new Date(); const s=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  if(t>=s) return "Today"; if(t>=s-864e5) return "Yesterday";
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"});
}
function listTime(t){ const l=dayLabel(t); return l==="Today"?hm(t):l; }
const dur = s => `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;
const isOnline = u => u && Date.now()-(u.lastSeen||0) < 100000;
const chatId = (a,b) => [a,b].sort().join("_");
const peerOf = c => (c.members||[]).find(m=>m!==S.me.uid);
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
const readFile = f => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=no; r.readAsDataURL(f); });
async function shrinkImage(file, max=1280, q=.74){
  const src = await readFile(file); const img = new Image(); img.src = src; await img.decode();
  const k = Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}

/* =========================  BACKEND: FIREBASE  ========================= */
function makeFire(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(), db = firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const C = n => db.collection(n);
  let me = null;
  const mail = u => u.trim().toLowerCase().replace(/[^a-z0-9._-]/g,"") + "@" + LOGIN_DOMAIN;
  return {
    demo:false,
    onAuth(cb){
      auth.onAuthStateChanged(async u => {
        if(!u){ me=null; return cb(null); }
        me = u.uid;
        let d = {};
        for(let i=0;i<3;i++){ try{ d = (await C("users").doc(me).get()).data(); }catch(e){} if(d) break; await new Promise(r=>setTimeout(r,800)); }
        d = d || {};
        const uname = d.username || u.email.split("@")[0];
        if(!d.name || !d.username){   // repair an account whose profile did not save at sign-up
          const fix = {uid:me, username:uname, name:d.name||uname}; if(!d.about) fix.about="Hey there! I am using Xapp";
          C("users").doc(me).set(fix,{merge:true}).catch(()=>{}); d = {...fix, ...d, ...fix};
        }
        cb({uid:me, username:uname, name:d.name||uname, about:d.about||"", photo:d.photo||""});
      });
    },
    async login(u,p){ await auth.signInWithEmailAndPassword(mail(u),p); },
    async signup(u,p,name){
      const c = await auth.createUserWithEmailAndPassword(mail(u),p);
      await C("users").doc(c.user.uid).set({uid:c.user.uid, username:u.trim().toLowerCase(), name:name||u, about:"Hey there! I am using Xapp", lastSeen:Date.now()});
    },
    logout(){ nat("Background","signOut"); return auth.signOut(); },
    emailFor(u){ return mail(u); },
    ping(){ if(me) C("users").doc(me).set({lastSeen:Date.now()},{merge:true}).catch(()=>{}); },
    updateProfile(p){ return C("users").doc(me).set(p,{merge:true}); },
    saveDiag(k,d){ if(!me) return; const r=C("users").doc(me); r.update({[k]:d}).catch(()=>r.set({[k]:d},{merge:true}).catch(()=>{})); },
    watchUsers(cb){ return C("users").onSnapshot(s=>cb(s.docs.map(d=>{ const x={uid:d.id,...d.data()}; if(!x.name) x.name=x.username||"Xapp user"; return x; }))); },
    watchChats(cb){ return C("chats").where("members","array-contains",me).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))); },
    watchMessages(cid, cb){ return C("chats").doc(cid).collection("messages").orderBy("at").limitToLast(300).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))); },
    async send(peer, m){
      const cid = chatId(me,peer), ref = C("chats").doc(cid);
      await ref.set({members:[me,peer].sort(), last:preview(m), lastAt:Date.now(), lastFrom:me, ["unread_"+peer]:firebase.firestore.FieldValue.increment(1)},{merge:true});
      await ref.collection("messages").add({...m, from:me, at:Date.now(), read:false});
    },
    async markRead(peer){
      const cid = chatId(me,peer), ref = C("chats").doc(cid);
      ref.set({members:[me,peer].sort(), ["unread_"+me]:0},{merge:true}).catch(()=>{});
      try{ const s = await ref.collection("messages").where("from","==",peer).where("read","==",false).get();
        if(!s.empty){ const b=db.batch(); s.docs.forEach(d=>b.update(d.ref,{read:true})); b.commit(); } }catch(e){}
    },
    async putMedia(dataUrl){
      const ref = C("media").doc(); const n = Math.ceil(dataUrl.length/CHUNK);
      for(let i=0;i<n;i++) await ref.collection("parts").doc(String(i)).set({d:dataUrl.slice(i*CHUNK,(i+1)*CHUNK)});
      await ref.set({n, by:me, at:Date.now()}); return ref.id;
    },
    async getMedia(id){
      const ref = C("media").doc(id); const h = await ref.get(); if(!h.exists) throw 0;
      const parts = await Promise.all([...Array(h.data().n).keys()].map(i=>ref.collection("parts").doc(String(i)).get()));
      return parts.map(p=>p.data().d).join("");
    },
    watchStatuses(cb){ return C("statuses").where("expiresAt",">",Date.now()).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))); },
    postStatus(s){ return C("statuses").add({...s, uid:me, at:Date.now(), expiresAt:Date.now()+864e5}); },
    deleteStatus(id){ return C("statuses").doc(id).delete(); },
    watchCalls(cb){
      let a=[], b=[]; const emit=()=>cb([...a,...b]);
      const u1 = C("calls").where("caller","==",me).onSnapshot(s=>{a=s.docs.map(d=>({id:d.id,...d.data()}));emit();});
      const u2 = C("calls").where("callee","==",me).onSnapshot(s=>{b=s.docs.map(d=>({id:d.id,...d.data()}));emit();});
      return ()=>{u1();u2();};
    },
    watchIncoming(onRing, onGone){
      return C("calls").where("callee","==",me).where("status","==","ringing").onSnapshot(s=>s.docChanges().forEach(c=>{
        const d = {id:c.doc.id,...c.doc.data()};
        if(c.type==="added" && Date.now()-d.createdAt < 45000) onRing(d);
        if(c.type==="removed") onGone(d.id);
      }));
    },
    async startCall(peer, video, sess){
      const ref = C("calls").doc(); sess.id = ref.id;
      const pc = sess.pc, offC = ref.collection("offerCandidates"), ansC = ref.collection("answerCandidates");
      const early = []; let ready = false; const addC = queueIce(pc, sess);
      pc.onicecandidate = e => { if(!e.candidate){ sess.log("gather-done"); return; } sess.logCand(e.candidate); const c=e.candidate.toJSON(); ready ? offC.add(c) : early.push(c); };
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
      await ref.set({caller:me, callee:peer, video, status:"ringing", offer:{type:offer.type,sdp:offer.sdp}, createdAt:Date.now()});
      ready = true; early.splice(0).forEach(c=>offC.add(c));
      sess.unsubs.push(ref.onSnapshot(s=>{ const d=s.data(); if(!d) return;
        if(d.answer && !pc.currentRemoteDescription && !sess.answering){ sess.answering=true;
          sess.log("answer-received"); pc.setRemoteDescription(new RTCSessionDescription(d.answer)).then(()=>{ addC.flush(); sess.onActive(); }).catch(e=>{ sess.log("srd-err "+(e&&e.message)); sess.answering=false; }); }
        if(["ended","declined","missed"].includes(d.status)) sess.close(d.status);
      }));
      sess.unsubs.push(ansC.onSnapshot(s=>s.docChanges().forEach(c=>{ if(c.type==="added") addC(c.doc.data()); })));
      sess.setStatus = st => ref.update(st).catch(()=>{});
    },
    async acceptCall(call, sess){
      const ref = C("calls").doc(call.id); sess.id = call.id;
      const pc = sess.pc, offC = ref.collection("offerCandidates"), ansC = ref.collection("answerCandidates");
      const addC = queueIce(pc, sess);
      pc.onicecandidate = e => { if(!e.candidate){ sess.log("gather-done"); return; } sess.logCand(e.candidate); ansC.add(e.candidate.toJSON()); };
      await pc.setRemoteDescription(new RTCSessionDescription(call.offer)); addC.flush();
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      await ref.update({answer:{type:ans.type,sdp:ans.sdp}, status:"active", answeredAt:Date.now()});
      sess.unsubs.push(offC.onSnapshot(s=>s.docChanges().forEach(c=>{ if(c.type==="added") addC(c.doc.data()); })));
      sess.unsubs.push(ref.onSnapshot(s=>{ const d=s.data(); if(d && ["ended","missed"].includes(d.status)) sess.close("ended"); }));
      sess.setStatus = st => ref.update(st).catch(()=>{});
      sess.onActive();
    },
    declineCall(id){ return C("calls").doc(id).update({status:"declined"}).catch(()=>{}); }
  };
}

    watchIncoming(r,g){ ringCb=r; goneCb=g; return ()=>{}; },
    testIncoming(){ ringCb && ringCb({id:"in"+Date.now(),caller:"ahmed",callee:me,video:Math.random()>.5,status:"ringing",createdAt:Date.now(),demo:true}); },
    async startCall(peer,video,sess){ sess.id="c"+Date.now(); const rec={id:sess.id,caller:me,callee:peer,video,status:"ringing",createdAt:Date.now()}; D.calls.push(rec); emit("calls",D.calls);
      sess.setStatus=st=>{ Object.assign(rec,st); emit("calls",D.calls); };
      sess.demoT=setTimeout(()=>{ rec.status="active"; rec.answeredAt=Date.now(); sess.onActive(); },2600); },
    async acceptCall(call,sess){ const rec={...call,status:"active",answeredAt:Date.now()}; D.calls.push(rec); sess.id=rec.id; sess.setStatus=st=>{ Object.assign(rec,st); emit("calls",D.calls); }; sess.onActive(); },
    declineCall(id){ D.calls.push({id,caller:"ahmed",callee:me,status:"declined",createdAt:Date.now()}); emit("calls",D.calls); },
    onTyping(cb){ return on("typing",cb,()=>null); }
  };
}

/* Remote ICE candidates can arrive before the answer/offer is applied: hold them until it is. */
function queueIce(pc, sess){
  const pend = [];
  const put = c => { sess.logRemote(c); pc.addIceCandidate(new RTCIceCandidate(c)).catch(e=>sess.log("addIce-err "+(e&&e.name))); };
  const add = c => { if(pc.remoteDescription && pc.remoteDescription.type) put(c); else pend.push(c); };
  add.flush = () => { if(pend.length) sess.log("flush "+pend.length); pend.splice(0).forEach(put); };
  return add;
}

}

function gatherWith(cfg, ms){
  return new Promise(async res=>{
    const out={types:{}, errs:[]}; let pc;
    try{ pc=new RTCPeerConnection(cfg); }catch(e){ out.errs.push("webrtc "+e.message); return res(out); }
    pc.createDataChannel("t");
    pc.onicecandidate=e=>{ const c=e.candidate; if(!c) return; const k=c.type+(c.relayProtocol?"/"+c.relayProtocol:""); out.types[k]=(out.types[k]||0)+1; };
    pc.onicecandidateerror=e=>{ out.errs.push(e.errorCode+(e.errorText?" "+e.errorText:"")); };
    const done=()=>{ try{ pc.close(); }catch(e){} res(out); };
    const t=setTimeout(done,ms); pc.onicegatheringstatechange=()=>{ if(pc.iceGatheringState==="complete"){ clearTimeout(t); setTimeout(done,200); } };
    try{ await pc.setLocalDescription(await pc.createOffer()); }catch(e){ out.errs.push("offer "+e.message); clearTimeout(t); done(); }
  });
}
async function netTest(){
  const sh=$("#sheet");
  const tests=[{key:"stun", label:"Internet address (STUN)", cfg:{iceServers:[{urls:"stun:stun.l.google.com:19302"}]}}];
  (CFG.turn||[]).forEach(t=>[].concat(t.urls).forEach(u=>tests.push({key:u, label:u.replace(/^turns?:/,"").replace("?transport="," · ")+(u.startsWith("turns:")?" · TLS":""), cfg:{iceServers:[{urls:u,username:t.username,credential:t.credential}],iceTransportPolicy:"relay"}})));
  const res={};
  const icon=ok=>`<span class="av sm" style="background:${ok===undefined?"var(--raise)":ok?"var(--good)":"var(--bad)"};font-size:15px;width:34px;height:34px">${ok===undefined?"…":ok?"✓":"✕"}</span>`;
  const why=(r,stun)=>{ if(!r) return "Testing…"; if(stun) return r.types.srflx?"OK · public address found":"No public address (STUN blocked on this network)";
    const t=Object.keys(r.types).filter(k=>k.startsWith("relay")); if(t.length) return "OK · "+t.join(", "); const e=r.errs[0]||"";
    return e.startsWith("401")?"Login rejected (401)":e.startsWith("701")?"Not reachable on this network (701)":e?("Failed · "+e):"No reply"; };
  const draw=done=>{ const relayOk=tests.slice(1).some(t=>res[t.key]&&res[t.key].ok);
    sh.innerHTML=`<header class="bar"><button class="ibtn" data-close aria-label="Back">${ico("back")}</button><div class="grow"><b style="font-size:17px">Connection test</b><div style="font-size:12.5px;color:#b9b3ab">${navigator.onLine?"Online":"Offline"} · ${tests.length-1} relay routes</div></div></header>
    <div class="list">${tests.map((t,i)=>`${i===1?'<div class="sec">Relay servers</div>':""}<div class="row" style="cursor:default">${icon(res[t.key]&&res[t.key].ok)}<div class="mid"><div class="top"><span class="name" style="font-size:14.5px">${esc(t.label)}</span></div><div class="sub"><span style="white-space:normal">${esc(why(res[t.key],t.key==="stun"))}</span></div></div></div>`).join("")}
    ${done?`<div class="empty" style="padding:18px 22px;text-align:left">${relayOk?"At least one relay works on this network, so calls can connect.":"No relay works on this network, so calls between different networks will fail."} Send a screenshot of this screen if calls still fail.</div>`:`<div class="empty">Testing… about 10 seconds</div>`}</div>`;
    sh.hidden=false; };
  sh.onclick=e=>{ if(e.target.closest("[data-close]")) sh.hidden=true; };
  draw(false);
  await Promise.all(tests.map(async t=>{ const r=await gatherWith(t.cfg,9000);
    r.ok = t.key==="stun" ? !!r.types.srflx : Object.keys(r.types).some(k=>k.startsWith("relay")); res[t.key]=r; draw(false); }));
  draw(true);
  const d={at:Date.now(), online:navigator.onLine, ua:navigator.userAgent.slice(0,140), results:tests.map(t=>({route:t.label, ok:!!(res[t.key]&&res[t.key].ok), detail:why(res[t.key],t.key==="stun")}))};
  try{ const i=await nat("App","getInfo"); if(i&&i.version) d.app=i.version; }catch(e){}
  if(navigator.connection) d.net=navigator.connection.type||navigator.connection.effectiveType||"";
  api.saveDiag("diagNet",d);
}

function tone(pattern){ // pattern: [[freq, ms],...] repeating
  stopTone(); let stop=false; const ac=AC(); ac.resume&&ac.resume();
  const loop=async()=>{ while(!stop){ for(const [f,ms] of pattern){ if(stop) break; if(f){ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f; g.gain.value=.12; o.connect(g).connect(ac.destination); o.start(); await new Promise(r=>setTimeout(r,ms)); o.stop(); } else await new Promise(r=>setTimeout(r,ms)); } } };
  loop(); window._toneStop=()=>{ stop=true; };
}

/* native bridge (APK): audio routing + back button */
function nat(plugin, method, opts={}, raw=false){
  let p;
  try{ const C=window.Capacitor; if(!C||!C.getPlatform||C.getPlatform()==="web") return Promise.resolve();
    if(C.Plugins&&C.Plugins[plugin]&&C.Plugins[plugin][method]) p=Promise.resolve(C.Plugins[plugin][method](opts));
    else if(C.nativePromise) p=C.nativePromise(plugin,method,opts); }catch(e){ p=Promise.reject(e); }
  if(!p) return Promise.resolve();
  return raw ? p : p.catch(()=>{});
}
function isNative(){ try{ const C=window.Capacitor; return !!(C&&C.getPlatform&&C.getPlatform()!=="web"); }catch(e){ return false; } }
function natOn(plugin, event, cb){
  try{ const C=window.Capacitor; if(!isNative()) return;
    if(C.Plugins&&C.Plugins[plugin]&&C.Plugins[plugin].addListener) C.Plugins[plugin].addListener(event,cb);
    else if(C.nativeCallback) C.nativeCallback(plugin,"addListener",{eventName:event},cb); }catch(e){}
}

  sess.logRemote=c=>{ const m=/ typ (\w+)/.exec(c.candidate||""); const k=(m?m[1]:"?")+"/"+((/ (udp|tcp) /i.exec(c.candidate||"")||[])[1]||"").toLowerCase(); sess.diag.remote[k]=(sess.diag.remote[k]||0)+1; };
  sess.saveDiag=async why=>{ if(api.demo||sess.diagSaved||!sess.pc&&!sess.diag.ev.length) return; sess.diagSaved=true; const d=sess.diag; d.end=why; d.connected=!!sess.connAt; d.secs=((Date.now()-t0)/1000)|0;
    try{ if(sess.pc){ const st=await sess.pc.getStats(); const pairs={}; let sel=null; const c={};
      st.forEach(s=>{ if(s.type==="local-candidate"||s.type==="remote-candidate") c[s.id]=s; if(s.type==="candidate-pair"){ pairs[s.state]=(pairs[s.state]||0)+1; if(s.nominated&&s.state==="succeeded") sel=s; }
        if(s.type==="inbound-rtp"&&s.kind==="audio") d.audioInBytes=s.bytesReceived; if(s.type==="outbound-rtp"&&s.kind==="audio") d.audioOutBytes=s.bytesSent; });
      d.pairs=pairs; if(sel){ const l=c[sel.localCandidateId]||{}, r=c[sel.remoteCandidateId]||{}; d.selected=(l.candidateType||"")+"/"+(l.relayProtocol||l.protocol||"")+" -> "+(r.candidateType||"")+"/"+(r.protocol||""); } } }catch(e){ d.statsErr=String(e); }
    try{ const i=await nat("App","getInfo"); if(i&&i.version) d.app=i.version; }catch(e){}
    api.saveDiag("diagCall",d); };
  sess.onActive=()=>{ if(sess.startedAt) return; sess.startedAt=Date.now(); stopTone(); route(sess); drawCall("active");
    nat("Background","callState",{active:true, peer:(S.users[peer]||{}).name||"Xapp", video:!!video, startedAt:Date.now()});
    if(!api.demo) sess.giveUpT=setTimeout(()=>{ if(sess.connected||sess.closed) return; const p=$("#callSt");
      clearInterval(sess.tick); sess.log("give-up 25s"); if(p) p.textContent="Can't connect · relay "+(sess.types.has("relay")?"reached":"NOT reached");
      toast("Call could not connect. Check Settings → Test connection."); setTimeout(()=>sess.hangup(),4000); },25000);
    sess.tick=setInterval(()=>{ const p=$("#callSt"); if(!p) return;
      if(sess.connected){ if(!sess.connAt) sess.connAt=Date.now(); p.textContent=dur((Date.now()-sess.connAt)/1000); } else p.textContent=sess.connAt?"Reconnecting…":"Connecting…"; },1000); };
  sess.close=(why)=>{ if(sess.closed) return; sess.log("close "+why); nat("Background","callState",{active:false}); const pcToClose=sess.pc; sess.pc=null; const keep={pc:pcToClose}; sess.closed=true; stopTone(); nat("AudioRoute","set",{active:false}); clearInterval(sess.tick); clearTimeout(sess.missT); clearTimeout(sess.giveUpT); clearTimeout(sess.demoT);
    sess.unsubs.forEach(f=>f&&f()); if(sess.local) sess.local.getTracks().forEach(t=>t.stop());
    sess.pc=keep.pc; sess.saveDiag(why).catch(()=>{}).finally(()=>{ try{ keep.pc&&keep.pc.close(); }catch(e){} });
    const p=$("#callSt"); if(p) p.textContent= why==="declined"?"Busy":why==="missed"?"No answer":"Call ended";
    setTimeout(()=>{ $("#call").hidden=true; $("#call").innerHTML=""; },why==="ended"?600:1400); call=null; };
  sess.hangup=()=>{ if(sess.closed) return; sess.setStatus(sess.startedAt?{status:"ended",endedAt:Date.now()}:{status:sess.outgoing?"missed":"declined",endedAt:Date.now()}); sess.close("ended"); };
  return sess;
}
async function prepare(sess){
  try{ sess.local=await getMedia(sess.video); sess.log("media ok "+sess.local.getTracks().map(t=>t.kind).join("+")); }
  catch(e){ sess.log("media err "+(e&&e.name)); if(sess.video){ try{ sess.local=await getMedia(false); sess.video=false; toast("Camera unavailable. Switched to voice."); }catch(e2){} } }
  if(!sess.local){ sess.log("no media"); sess.saveDiag("no-media"); toast("Allow microphone access to make calls"); return false; }
  if(!api.demo){
    const pc=new RTCPeerConnection({...ICE, iceCandidatePoolSize:2}); sess.pc=pc;
    sess.local.getTracks().forEach(t=>pc.addTrack(t,sess.local));
    pc.ontrack=e=>{ if(e.streams[0]) sess.remote=e.streams[0]; else sess.remote.addTrack(e.track); attachRemote(sess); };
    pc.onicecandidateerror=e=>{ const k=e.errorCode+" "+(e.url||""); sess.diag.errs[k]=(sess.diag.errs[k]||0)+1; };
    pc.onconnectionstatechange=()=>sess.log("conn "+pc.connectionState);
    pc.onsignalingstatechange=()=>sess.log("sig "+pc.signalingState);
    pc.onicegatheringstatechange=()=>sess.log("gather "+pc.iceGatheringState);
    pc.oniceconnectionstatechange=()=>{ const st=pc.iceConnectionState; sess.log("ice "+st);
      if(st==="connected"||st==="completed"){ sess.connected=true; clearTimeout(sess.failT); attachRemote(sess); route(sess); }
      if(st==="disconnected"){ sess.connected=false; const p=$("#callSt"); if(p) p.textContent="Reconnecting…"; }
      if(st==="failed"){ sess.connected=false; const p=$("#callSt"); if(p) p.textContent="Can't connect · relay "+(sess.types.has("relay")?"reached":"NOT reached");
        toast("The networks blocked the call. A relay (TURN) server is needed."); sess.failT=setTimeout(()=>sess.hangup(),3500); } };
  }
  return true;
}
async function startCall(peer, video){
  if(call) return toast("You are already on a call");
  const sess=newSession(peer,video,true); call=sess; drawCall("outgoing");
  if(!await prepare(sess)){ $("#call").hidden=true; call=null; return; }
  drawCall("outgoing"); tone([[440,1200],[0,2600]]);
  try{ await api.startCall(peer,sess.video,sess); }catch(e){ toast("Call failed. Check your connection."); sess.close("ended"); return; }
  sess.missT=setTimeout(()=>{ if(!sess.startedAt) { sess.setStatus({status:"missed"}); sess.close("missed"); } },40000);
}
function incoming(c){
  if(call && (call.id===c.id || (call.inc && call.inc.id===c.id))) return;   // same call reported again
  if(call){ api.declineCall(c.id); return; }
  ringing=c; const sess=newSession(c.caller,c.video,false); sess.inc=c; call=sess; sess.log("ringing"); drawCall("incoming");
  const nativeRings = document.hidden && S.bg && S.bg.signedIn;
  if(!nativeRings) tone([[523,180],[659,180],[784,260],[0,900]]);
  applyCallAction();
  if(document.hidden && "Notification" in window && Notification.permission==="granted"){ try{ const u=S.users[c.caller]; new Notification(`${u?u.name:"Xapp"} is calling`,{body:c.video?"Video call":"Voice call",tag:"call"}); }catch(e){} }
}
function gone(id){ if(call && call.inc && call.inc.id===id && !call.startedAt && !call.answering){ call.log("caller cancelled"); call.close("missed"); } }
async function answer(){
  const sess=call; if(!sess||sess.answering) return; sess.answering=true; sess.log("answer tapped"); stopTone(); drawCall("connecting");
  if(!await prepare(sess)){ api.declineCall(sess.inc.id); sess.close("ended"); return; }
  try{ await api.acceptCall(sess.inc,sess); }catch(e){ toast("Could not connect the call"); sess.close("ended"); }
}
function drawCall(state){
  const s=call; if(!s) return; const u=S.users[s.peer]||{uid:s.peer,name:"Contact"}; const el=$("#call");
  const showVid=s.video && (state==="active"||state==="outgoing"||state==="connecting") && s.local;
  el.classList.toggle("video-on",!!(s.video&&state==="active"));
  const label={outgoing:"Ringing…",incoming:s.video?"Incoming video call":"Incoming voice call",connecting:"Connecting…",active:"0:00"}[state];
  el.innerHTML=`${s.video&&state==="active"?`<video class="remote" id="rv" autoplay playsinline muted></video>`:""}<audio id="ra" autoplay></audio>
    ${showVid?`<video class="local" id="lv" autoplay playsinline muted></video>`:""}
    <div class="info"><span class="enc">Xapp · end-to-end encrypted call</span>${avatar(u,"xl "+(state==="incoming"||state==="outgoing"?"pulse":""))}<h2>${esc(u.name)}</h2><p id="callSt">${label}</p></div>
    <div class="ctrls">${state==="incoming"
      ? `<button class="end" id="kDec" aria-label="Decline">${endIco}</button><button class="ok" id="kAns" aria-label="Answer">${ico(s.video?"video":"phone")}</button>`
      : `<button id="kSpk" aria-label="Speaker" class="${s.speaker?"on":""}">${ico("speaker")}</button>${s.video?`<button id="kCam" aria-label="Camera on or off" class="${s.camOff?"on":""}">${ico(s.camOff?"videooff":"video")}</button><button id="kFlip" aria-label="Switch camera">${ico("flip")}</button>`:""}
         <button id="kMute" aria-label="Mute" class="${s.muted?"on":""}">${ico(s.muted?"micoff":"mic")}</button><button class="end" id="kEnd" aria-label="End call">${endIco}</button>`}</div>`;
  el.hidden=false;
  const lv=$("#lv"); if(lv&&s.local) lv.srcObject=s.local;
  attachRemote(s);
  if(state==="incoming"){ $("#kDec").onclick=()=>{ api.declineCall(s.inc.id); s.close("declined"); }; $("#kAns").onclick=answer; return; }
  $("#kEnd").onclick=()=>s.hangup();
  $("#kMute").onclick=()=>{ s.muted=!s.muted; s.local&&s.local.getAudioTracks().forEach(t=>t.enabled=!s.muted); const b=$("#kMute"); b.classList.toggle("on",s.muted); b.innerHTML=ico(s.muted?"micoff":"mic"); };
  $("#kSpk").onclick=e=>{ s.speaker=!s.speaker; e.currentTarget.classList.toggle("on",s.speaker); route(s); toast(s.speaker?"Speaker on":"Earpiece"); };
  if($("#kCam")) $("#kCam").onclick=()=>{ s.camOff=!s.camOff; s.local&&s.local.getVideoTracks().forEach(t=>t.enabled=!s.camOff); const b=$("#kCam"); b.classList.toggle("on",s.camOff); b.innerHTML=ico(s.camOff?"videooff":"video"); };
  if($("#kFlip")) $("#kFlip").onclick=async()=>{ try{ s.front=!s.front; const ns=await navigator.mediaDevices.getUserMedia({video:{facingMode:s.front?"user":"environment",width:{ideal:1280},height:{ideal:720}}});
    const nt=ns.getVideoTracks()[0], old=s.local.getVideoTracks()[0]; if(s.pc){ const snd=s.pc.getSenders().find(x=>x.track&&x.track.kind==="video"); snd&&snd.replaceTrack(nt); }
    s.local.removeTrack(old); old.stop(); s.local.addTrack(nt); const l=$("#lv"); if(l){ l.srcObject=s.local; l.style.transform=s.front?"scaleX(-1)":"none"; } }catch(e){ toast("Could not switch camera"); } };
}
addEventListener("beforeunload",()=>{ if(call) call.hangup(); });
/* Android back button (APK) */
function onBack(){
  if(call) return; if(!$("#story").hidden){ $("#story").hidden=true; $("#story").style.background=""; return; }
  if(!$("#sheet").hidden){ $("#sheet").hidden=true; return; }
  if(S.peer&&innerWidth<900){ closeChat(); return; }
  if(S.tab!=="chats"){ setTab("chats"); return; }
  nat("App","minimizeApp");
}
try{ const C=window.Capacitor; if(C&&C.getPlatform&&C.getPlatform()!=="web"){
  if(C.Plugins&&C.Plugins.App&&C.Plugins.App.addListener) C.Plugins.App.addListener("backButton",onBack);
  else if(C.nativeCallback) C.nativeCallback("App","addListener",{eventName:"backButton"},onBack); } }catch(e){}
</script>
