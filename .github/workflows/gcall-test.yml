name: Test group calls (3 virtual phones)

on:
  push:
    branches: [main]
    paths: ['www/gcall.js', 'tests/gcall.e2e.mjs', '.github/workflows/gcall-test.yml', 'firestore.rules']
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm i --no-save firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10 playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --only auth,firestore --project xapp-test "node tests/gcall.e2e.mjs"
