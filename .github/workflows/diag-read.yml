name: Read phone diagnostics

on:
  push:
    branches: [main]
    paths: ['diag/request.txt', 'scripts/diag_read.py']
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read diagnostics saved by the phones
        run: python3 scripts/diag_read.py
