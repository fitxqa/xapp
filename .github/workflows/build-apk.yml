name: Build Xapp APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Create Android project + Xapp icon
        run: |
          npx cap add android
          npx -y @capacitor/assets@3.0.5 generate --android \
            --iconBackgroundColor '#0b0b0c' --iconBackgroundColorDark '#0b0b0c' \
            --splashBackgroundColor '#0b0b0c' --splashBackgroundColorDark '#0b0b0c'
          cp native/*.java android/app/src/main/java/qa/fitx/xapp/

      - name: Camera / microphone permissions, version, signing
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n</manifest>#' "$M"
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' "$M"
          cat >> android/app/build.gradle <<'G'

          // ---- Xapp: version from the build number, signed with the Xapp key ----
          android {
              defaultConfig {
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
                  versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
              }
              signingConfigs {
                  xapp {
                      storeFile file(System.getenv("XAPP_KEYSTORE") ?: "none.keystore")
                      storePassword System.getenv("XAPP_KEYSTORE_PASSWORD") ?: ""
                      keyAlias "xapp"
                      keyPassword System.getenv("XAPP_KEYSTORE_PASSWORD") ?: ""
                  }
              }
              buildTypes {
                  release {
                      if (System.getenv("XAPP_KEYSTORE")) { signingConfig signingConfigs.xapp }
                  }
              }
          }
          G
          grep -c RECORD_AUDIO "$M"

      - name: Signing key (XAPP_ALL secret)
        env:
          ALL: ${{ secrets.XAPP_ALL }}
          KS: ${{ secrets.XAPP_KEYSTORE_B64 }}
          KP: ${{ secrets.XAPP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ALL" ]; then
            C=$(printf '%s\n' "$ALL" | tr -d ' \r\t' | grep -oE '[A-Za-z0-9+/]{1000,}={0,2}' | awk '{ if (length($0) > length(m)) m=$0 } END { print m }')
            [ -z "$C" ] && C=$(printf '%s' "$ALL" | tr -d ' \n\r\t')
            if J=$(printf '%s' "$C" | base64 -d 2>/dev/null) && printf '%s' "$J" | jq -e . >/dev/null 2>&1; then
              KS=$(printf '%s' "$J" | jq -r .keystoreB64); KP=$(printf '%s' "$J" | jq -r .keystorePassword)
              echo "::add-mask::$KP"
            else
              echo "::warning::XAPP_ALL was not copied completely — building a test APK instead."
            fi
          fi
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/xapp.keystore"
            echo "XAPP_KEYSTORE=$RUNNER_TEMP/xapp.keystore" >> "$GITHUB_ENV"
            echo "XAPP_KEYSTORE_PASSWORD=$KP" >> "$GITHUB_ENV"
            echo "MODE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No XAPP_ALL secret in this repo — building a test-signed APK. Add the secret so new versions install over old ones."
            echo "MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          T=assembleRelease; [ "$MODE" = debug ] && T=assembleDebug
          if ! ./gradlew $T --no-daemon 2>&1 | tee build.log; then
            grep -E "error:|What went wrong|e: |FAILURE|Could not" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/$MODE/app-$MODE.apk ../Xapp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Xapp-apk
          path: Xapp.apk

      - name: Publish release (download link for phones)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Xapp 1.0.${{ github.run_number }}
          body: Download **Xapp.apk** on the phone and install it. Open Xapp and sign in or create an account.
          files: Xapp.apk
          make_latest: true
