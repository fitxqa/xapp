name: Test Firestore rules

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'tests/rules.test.mjs', '.github/workflows/rules-test.yml']
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm i --no-save firebase-tools@13 @firebase/rules-unit-testing@3 firebase@10
      - run: npx firebase emulators:exec --only firestore --project xapp-test "node tests/rules.test.mjs"
